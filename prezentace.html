<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prezentace | USA &amp; Canada</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="deckpage">
<header class="top" id="top"></header>
<main id="deck">
  <div class="viewport" id="vp"><div class="stage" id="stage"></div></div>
  <div class="controls">
    <button id="prev" aria-label="Předchozí slide">←</button>
    <button id="next" aria-label="Další slide">→</button>
    <span class="count" id="cnt"></span>
    <div class="bar"><i id="barf"></i></div>
    <span class="hint">šipky: posun · F: celá obrazovka</span>
    <button id="full">Celá obrazovka</button>
  </div>
</main>
<script src="js/geo-data.js"></script><script src="js/atlas.js"></script><script src="js/app.js"></script><script src="js/slides.js"></script>
</body>
</html>
