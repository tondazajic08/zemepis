<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Novinky | USA &amp; Canada</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top" id="top"></header>
<div class="pagehead"><div class="wrap"><h1>Novinky</h1><p>Aktuální zprávy o USA, Kanadě a obchodní dohodě USMCA z českých médií. Seznam se automaticky obnovuje každé dvě hodiny.</p></div></div>
<main class="wrap">
  <div class="newsbar"><div class="filters light" id="nf"></div><span class="muted" id="upd"></span></div>
  <div class="news" id="news"><p class="muted">Načítám zprávy…</p></div>
  <p class="muted" style="margin-top:18px;font-size:14px">Zprávy vybírá automaticky Google News podle klíčových slov, web je neupravuje. Kliknutím otevřeš článek u původního vydavatele.</p>
</main>
<footer id="foot"></footer>
<script src="js/app.js"></script>
<script>
(function(){
  const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
  const el=document.getElementById("news"),nf=document.getElementById("nf");let data=[],tag="Vše";
  const when=d=>{const m=(Date.now()-new Date(d))/6e4;return m<60?"před "+Math.max(1,Math.round(m))+" min":m<1440?"před "+Math.round(m/60)+" h":new Date(d).toLocaleDateString("cs-CZ",{day:"numeric",month:"numeric",year:"numeric"});};
  function paint(){const l=data.filter(x=>/^https:\/\//.test(x.u)&&(tag==="Vše"||x.k===tag));el.innerHTML=l.length?l.map(x=>`<a href="${esc(x.u)}" target="_blank" rel="noopener"><b>${esc(x.t)}</b><small><span class="ntag">${esc(x.k)}</span>${esc(x.s)} · ${when(x.d)}</small></a>`).join(""):'<p class="muted">Žádné zprávy.</p>';}
  function load(){fetch("data/news.json?"+Date.now()).then(r=>r.json()).then(j=>{data=j.items;document.getElementById("upd").textContent="Aktualizováno "+when(j.updated);
    nf.innerHTML=["Vše","USA","Kanada","Obchod"].map(t=>`<button data-t="${t}" aria-pressed="${t===tag}">${t}</button>`).join("");paint();}).catch(()=>{el.innerHTML='<p class="muted">Zprávy se nepodařilo načíst.</p>';});}
  nf.onclick=e=>{const b=e.target.closest("button");if(!b)return;tag=b.dataset.t;nf.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));paint();};
  load();setInterval(load,15*6e4);
})();
</script>
</body>
</html>
